services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloud_detective}
      POSTGRES_USER: ${POSTGRES_USER:-cloud_detective}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloud_detective_local}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://cloud_detective:cloud_detective_local@postgres:5432/cloud_detective}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RESPONSE_MODE: ${RESPONSE_MODE:-dry_run}
      BASELINE_WARMUP_HOURS: ${BASELINE_WARMUP_HOURS:-24}
      RULES_PATH: ${RULES_PATH:-/app/rules}
    ports:
      - "8000:8000"
    volumes:
      - ./apps/backend:/app
      - ./rules:/app/rules:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn cloud_detective.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    profiles: ["aws"]
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://cloud_detective:cloud_detective_local@postgres:5432/cloud_detective}
      AWS_REGION: ${AWS_REGION:-ap-southeast-2}
      AWS_PROFILE: ${AWS_PROFILE:-cloud-detective}
      QUEUE_URL: ${QUEUE_URL:-}
      RULES_PATH: /app/rules
    volumes:
      - ./apps/backend:/app
      - ./rules:/app/rules:ro
      - ${USERPROFILE}/.aws:/home/app/.aws:ro
    depends_on:
      api:
        condition: service_healthy
    command: python -m cloud_detective.worker

  web:
    build:
      context: ./apps/web
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - web-node-modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres-data:
  web-node-modules:
